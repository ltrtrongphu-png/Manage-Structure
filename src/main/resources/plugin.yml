name: ManageStructure
version: '1.0.0'
main: com.example.managestructure.ManageStructure
api-version: '1.21'
author: YourName
description: Bao ve cong trinh Nether va The End, chan pha block / mo ruong khi khong co quyen

commands:
  managestructure:
    description: Lenh quan ly plugin ManageStructure
    usage: /managestructure <pos1|pos2|create|remove|list|info|tp|locate|reload>
    aliases: [ms, mstructure]

permissions:
  managestructure.admin:
    description: Quyen su dung cac lenh quan tri ManageStructure
    default: op
  managestructure.bypass:
    description: Bo qua toan bo bao ve cong trinh (pha block, mo ruong, dat block...)
    default: op
