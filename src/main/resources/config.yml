# =========================================
#  ManageStructure - Config
# =========================================

settings:
  # --- AUTO-DETECT (khong can danh dau vung, ap dung cho toan server) ---
  auto-detect-blocks: true       # Tu dong chan pha cac block dac trung trong "auto-break-blocks" o duoi
  auto-detect-containers: true   # Tu dong chan mo cac ruong/shulker/barrel CHUA TUNG DUOC MO (co loot table)

  # --- VUNG THU CONG (dung /ms pos1, pos2, create...) ---
  protect-manual-regions: true
  only-nether-and-end: true       # Chi cho tao vung thu cong trong the gioi Nether/The End
  protect-place: true              # Chan dat block trong VUNG THU CONG (khong ap dung cho auto-detect)
  protect-explosions: true         # Chan no pha block (ca auto-detect lan vung thu cong)
  protect-hanging: true            # Bao ve item frame/tranh treo/armor stand (chi trong VUNG THU CONG)

# Danh sach block se tu dong bi bao ve o BAT KY DAU trong the gioi Nether/The End
# neu nguoi choi khong co quyen "managestructure.access".
# Luu y: mot so block (vd BLACKSTONE) cung sinh ra tu nhien o bien Basalt Deltas,
# neu thay bi bao ve qua tay ban co the xoa bot trong danh sach nay.
auto-break-blocks:
  # --- Nether Fortress ---
  - NETHER_BRICKS
  - NETHER_BRICK_FENCE
  - NETHER_BRICK_STAIRS
  - NETHER_BRICK_WALL
  - NETHER_BRICK_SLAB
  - RED_NETHER_BRICKS
  - RED_NETHER_BRICK_STAIRS
  - RED_NETHER_BRICK_WALL
  - RED_NETHER_BRICK_SLAB
  - NETHER_WART_BLOCK
  - CHAIN
  - LANTERN

  # --- Bastion Remnant ---
  - POLISHED_BLACKSTONE
  - POLISHED_BLACKSTONE_BRICKS
  - CRACKED_POLISHED_BLACKSTONE_BRICKS
  - CHISELED_POLISHED_BLACKSTONE
  - GILDED_BLACKSTONE
  - POLISHED_BLACKSTONE_STAIRS
  - POLISHED_BLACKSTONE_BRICK_STAIRS
  - POLISHED_BLACKSTONE_WALL
  - POLISHED_BLACKSTONE_BRICK_WALL
  - POLISHED_BLACKSTONE_SLAB
  - POLISHED_BLACKSTONE_BRICK_SLAB
  - POLISHED_BLACKSTONE_PRESSURE_PLATE
  - POLISHED_BLACKSTONE_BUTTON
  - LODESTONE

  # --- End City / End Ship ---
  - PURPUR_BLOCK
  - PURPUR_PILLAR
  - PURPUR_STAIRS
  - PURPUR_SLAB
  - END_STONE_BRICKS
  - END_STONE_BRICK_STAIRS
  - END_STONE_BRICK_WALL
  - END_STONE_BRICK_SLAB
  - END_ROD

